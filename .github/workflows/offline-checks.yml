name: Offline reference checks
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install pytest
      - name: Fetch the pinned CLI release used by portable kit tests
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import urllib.request

          filename = "xhh_sdk-0.5.0rc4+standalone.7-py3-none-any.whl"
          url = "https://github.com/HSJ-BanFan/xiaoheihe-api-collect/releases/download/v0.5.0rc4%2Bstandalone.7/" + filename
          with urllib.request.urlopen(url, timeout=60) as response:
              data = response.read(2 * 1024 * 1024)
          expected = "2ca9af8ece4e105631e62c6c4043e1fa758c766e16031afd4e52028bc44293ff"
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit("CLI release digest mismatch")
          target = Path("cli/dist/standalone-7-clean") / filename
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)
          PY
      - run: python scripts/generate_reference.py --check
      - run: python scripts/check_repo.py
      - run: python -m pytest tests -q
