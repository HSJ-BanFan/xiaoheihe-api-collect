name: Docs site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'NOTICE.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'cli/README.md'
      - 'cli/RELEASE.md'
      - 'signer/README.md'
      - 'mkdocs.yml'
      - 'scripts/build_docs_site.py'
      - '.github/workflows/docs-site.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MkDocs
        run: pip install "mkdocs-material>=9,<10"
      - name: Stage documentation sources
        run: python scripts/build_docs_site.py --stage site-src
      - name: Build site
        env:
          XHH_DOCS_SRC: site-src
        run: mkdocs build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
