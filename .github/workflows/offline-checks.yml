name: Offline reference checks
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve pinned text bytes on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned test and build tools
        run: |
          python -m pip install uv==0.12.7 pytest==9.1.1
          uv pip install --system setuptools==84.0.0
      - name: Build the unreleased candidate offline
        working-directory: cli
        run: python -B scripts/build_release.py --out dist/web-candidate-final
      - name: Check the canonical candidate against the portable kit pin
        run: |
          python - <<'PY'
          import hashlib
          import importlib.util
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "kit", "skill-kit/xiaoheihe-publisher/scripts/xhh_cli.py")
          kit = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(kit)
          target = Path("cli/dist/web-candidate-final") / f"xhh_sdk-{kit.CLI_VERSION}-py3-none-any.whl"
          if hashlib.sha256(target.read_bytes()).hexdigest() != kit.WHEEL_SHA256:
              raise SystemExit("locally built candidate does not match the portable kit wheel pin")
          PY
      - name: Verify the installed candidate without live requests
        working-directory: cli
        run: python -B scripts/verify_release_install.py --release dist/web-candidate-final > dist/web-candidate-final/install-verification.log
      - run: python scripts/generate_reference.py --check
      - run: python scripts/check_repo.py
      - run: python -m pytest tests -q
      - name: Run the CLI regression tests
        working-directory: cli
        run: python -m pytest tests -q
