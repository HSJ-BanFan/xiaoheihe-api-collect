name: 接口失效或纠错
description: 报告一条接口、一个字段或一处文档的错误
title: "[接口问题] "
labels: ["bug", "documentation"]
body:
  - type: markdown
    attributes:
      value: |
        感谢上报。提交前请先看[贡献指南](https://github.com/HSJ-BanFan/xiaoheihe-api-collect/blob/main/CONTRIBUTING.md)和[证据口径](https://hsj-banfan.github.io/xiaoheihe-api-collect/docs/evidence/)。

        本表单只需要脱敏摘要。不要粘贴账号、Cookie、手机号、验证码、Token、完整原始响应或设备实值。
        安全问题请按[安全说明](https://github.com/HSJ-BanFan/xiaoheihe-api-collect/blob/main/SECURITY.md)处理，不要开公开 issue。
  - type: input
    id: route
    attributes:
      label: 接口路径或文档页面
      description: 尽量写完整路径；如果是文档问题，给出页面链接。
      placeholder: 例如 /search/get_search_result 或 docs/search/3f2a1c.md
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 问题类型
      options:
        - 接口调用失败或返回发生变化
        - 参数字段或说明有误
        - 文档链接或分类有误
        - CLI 行为与文档不一致
        - 其他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CLI 版本
      description: 运行 xhh-sdk --version，只贴版本号。
      placeholder: 0.5.0rc4+standalone.7
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 用到的命令或操作顺序，去掉账号与凭据。
      placeholder: |
        1. xhh-sdk catalog --route ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: 实际结果（脱敏）
      description: 状态码、错误信息或字段差异即可，不要贴完整响应。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: false
  - type: dropdown
    id: evidence
    attributes:
      label: 这份报告的来源
      options:
        - 我在当前版本实测过
        - 我抓包见过
        - 我只看了代码或文档，属于推断
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 内容已脱敏，不含账号、Cookie、手机号、验证码、Token、完整原始响应或设备实值。
          required: true
        - label: 我理解接口目录是研究记录，不代表平台授权，也不保证长期可用。
          required: true
