<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" role="img" aria-labelledby="title desc">
  <title id="title">小黑盒 API 收集与研究项目概览</title>
  <desc id="desc">公开仓库包含接口参考、脱敏研究报告、Python CLI 和签名器源码。在线 App 签名调用还需要用户本机的凭据、APK 提取资源、构建的 JAR 和 Java 17 或更高版本。</desc>
  <rect width="1240" height="620" fill="#f3f0e7"/>
  <path d="M0 0h1240v10H0z" fill="#d76443"/>
  <circle cx="1137" cy="111" r="74" fill="#e5ebe3"/>
  <circle cx="1137" cy="111" r="47" fill="none" stroke="#21443d" stroke-width="2"/>
  <circle cx="1137" cy="111" r="9" fill="#d76443"/>
  <path d="M1089 111h96M1137 63v96M1104 78l66 66M1170 78l-66 66" stroke="#81968b" stroke-width="1.5" opacity=".65"/>

  <text x="58" y="58" fill="#d76443" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" letter-spacing="2">COMMUNITY RESEARCH / 非官方项目</text>
  <text x="58" y="112" fill="#163b36" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="700">从接口目录，到可复核的调用</text>
  <text x="60" y="151" fill="#50635c" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="18">脱敏文档 · 研究证据 · Python CLI</text>

  <rect x="48" y="194" width="829" height="344" rx="22" fill="#fffdf8" stroke="#d9d5ca" stroke-width="1.5"/>
  <text x="72" y="229" fill="#284d43" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700">仓库公开内容</text>
  <text x="850" y="229" text-anchor="end" fill="#77847c" font-family="Consolas, monospace" font-size="12">DOCS / DATA / SOURCE</text>

  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
    <rect x="68" y="251" width="186" height="254" rx="13" fill="#f6eee4"/>
    <rect x="68" y="251" width="186" height="5" rx="2.5" fill="#d76443"/>
    <text x="87" y="284" fill="#9b6048" font-family="Consolas, monospace" font-size="12" font-weight="700">01 / DOCS + DATA</text>
    <text x="87" y="324" fill="#163b36" font-size="21" font-weight="700">接口参考</text>
    <text x="87" y="367" fill="#d76443" font-size="28" font-weight="700">448 条</text>
    <text x="87" y="398" fill="#4e5f57" font-size="14">按业务分组的路径、</text>
    <text x="87" y="420" fill="#4e5f57" font-size="14">参数与证据来源</text>
    <rect x="84" y="453" width="154" height="31" rx="15" fill="#fffaf3"/>
    <text x="161" y="474" text-anchor="middle" fill="#735646" font-size="12">243 条历史 GET 白名单</text>

    <rect x="267" y="251" width="186" height="254" rx="13" fill="#eaf0ea"/>
    <rect x="267" y="251" width="186" height="5" rx="2.5" fill="#66877a"/>
    <text x="286" y="284" fill="#527064" font-family="Consolas, monospace" font-size="12" font-weight="700">02 / RESEARCH</text>
    <text x="286" y="324" fill="#163b36" font-size="21" font-weight="700">研究报告</text>
    <text x="286" y="367" fill="#416b5c" font-size="25" font-weight="700">脱敏整理</text>
    <text x="286" y="398" fill="#4e5f57" font-size="14">接口范围、认证签名、</text>
    <text x="286" y="420" fill="#4e5f57" font-size="14">线上验收与未验证项</text>
    <rect x="283" y="453" width="154" height="31" rx="15" fill="#f7faf5"/>
    <text x="360" y="474" text-anchor="middle" fill="#496459" font-size="12">事实 / 推断 / 未验证</text>

    <rect x="466" y="251" width="186" height="254" rx="13" fill="#edf0f5"/>
    <rect x="466" y="251" width="186" height="5" rx="2.5" fill="#647992"/>
    <text x="485" y="284" fill="#576b82" font-family="Consolas, monospace" font-size="12" font-weight="700">03 / PYTHON</text>
    <text x="485" y="324" fill="#163b36" font-size="21" font-weight="700">Python CLI</text>
    <text x="485" y="367" fill="#4a6684" font-size="23" font-weight="700">离线目录</text>
    <text x="485" y="398" fill="#4e5f57" font-size="14">另含少量已验收的</text>
    <text x="485" y="420" fill="#4e5f57" font-size="14">线上操作命令</text>
    <rect x="482" y="453" width="154" height="31" rx="15" fill="#f7f9fc"/>
    <text x="559" y="474" text-anchor="middle" fill="#4c617a" font-size="12">Python 3.10+</text>

    <rect x="665" y="251" width="190" height="254" rx="13" fill="#e8eee9"/>
    <rect x="665" y="251" width="190" height="5" rx="2.5" fill="#21443d"/>
    <text x="684" y="284" fill="#416459" font-family="Consolas, monospace" font-size="12" font-weight="700">04 / SIGNER SOURCE</text>
    <text x="684" y="324" fill="#163b36" font-size="21" font-weight="700">签名器源码</text>
    <text x="684" y="367" fill="#416b5c" font-size="23" font-weight="700">本地构建</text>
    <text x="684" y="398" fill="#4e5f57" font-size="14">Java loader 源码位于</text>
    <text x="684" y="420" fill="#163b36" font-family="Consolas, monospace" font-size="14">signer/</text>
    <rect x="681" y="453" width="158" height="31" rx="15" fill="#f7faf5"/>
    <text x="760" y="474" text-anchor="middle" fill="#496459" font-size="12">不含构建出的 JAR</text>
  </g>

  <path d="M887 366h26m-8-8 8 8-8 8" fill="none" stroke="#d76443" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="900" y="345" text-anchor="middle" fill="#9c5c45" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="11">本地准备</text>

  <rect x="928" y="194" width="264" height="344" rx="22" fill="#163b36"/>
  <text x="952" y="229" fill="#bdcfc2" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">用户本地环境</text>
  <text x="952" y="276" fill="#fffaf0" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700">在线 App 请求</text>
  <text x="952" y="311" fill="#adc0b3" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13">签名调用需要用户自备：</text>
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" fill="#fffaf0">
    <circle cx="957" cy="346" r="4" fill="#e8845c"/><text x="971" y="351">账号登录凭据</text>
    <circle cx="957" cy="379" r="4" fill="#e8845c"/><text x="971" y="384">官方 APK 提取资源</text>
    <circle cx="957" cy="412" r="4" fill="#e8845c"/><text x="971" y="417">本地构建的 signer JAR</text>
    <circle cx="957" cy="445" r="4" fill="#e8845c"/><text x="971" y="450">Java 17 或更高版本</text>
  </g>
  <rect x="949" y="474" width="222" height="39" rx="10" fill="#254d45"/>
  <text x="1060" y="499" text-anchor="middle" fill="#d8e2d9" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12">APK / JAR / SO / 账号数据不随仓库发布</text>

  <path d="M58 572h1124" stroke="#d3cec1" stroke-width="1"/>
  <circle cx="67" cy="594" r="5" fill="#d76443"/>
  <text x="82" y="600" fill="#53635c" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14">参考记录数量不代表线上可用数量；CLI 的线上验收只覆盖报告列出的功能。</text>
</svg>
